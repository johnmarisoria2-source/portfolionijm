<!DOCTYPE html>
<html>
    <head>
        <title>Activity4</title>
    </head>
    <body>
        <h2>User Information Form</h2>
        <form action="" method="post">
            <label for="fname">first Name:</label><br>
            <input type="text" id="fname" name="firstname" required><br><br>
           
            <label for="lname">last Name:</label><br>
            <input type="text" id="lname" name="lastname" required><br><br>

            <label for="age">Age:</label><br>
            <input type="number" id="age" name="age" required><br><br>

            <label>Gender:</label><br>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">female</label>
            <input type="radio" id="other" name="gender" value="other">
            <label for="other">other</label><br><br>

            <label>Hobbies:</label><br>
            <input type="checkbox" id="hobby1" name="hobby" value="playing">
            <label for="hobby1">playing</label><br>
            <input type="checkbox" id="hobby2" name="hobby" value="watching movies">
            <label for="hobby2">watching movies</label><br>
            <input type="checkbox" id="hobby3" name="hobby" value="coding">
            <label for="hobby3">coding</label><br>
            <input type="checkbox" id="hobby4" name="hobby" value="reading">
            <label for="hobby4">reading</label><br>
            <input type="checkbox" id="hobby5" name="hobby" value="sports">
            <label for="hobby5">sports</label><br><br>

            <label for="year-level">Year Level:</label><br>
            <select name="year_level" id="year-level">
                <option value="1st Year">1st Year</option>
                <option value="2nd Year">2nd Year</option>
                <option value="3rd Year">3rd Year</option>
                <option value="4th Year">4th Year</option>
            </select><br><br>

            <button type="submit">Submit</button>
            <button type="reset">Clear</button>

        </form>
        </body>
        </html>
