<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Activity 11 - JavaScript Loops</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<h1>JavaScript Loops</h1>
<div class="container">

<!-- FOR LOOP -->
<div class="box">
<h2>For Loop</h2>
<label>Enter number:
<input type="number" id="forNumber" />
</label>
<label>Enter text:
<input type="text" id="forText" />
</label>
<div class="btn-group">
<button class="btn-show" onclick="showFor()">Show</button>
<button class="btn-clear" onclick="clearFor()">Clear</button>
</div>
<ol id="forOutput"></ol>
</div>
<!-- WHILE LOOP -->
<div class="box">
<h2>While Loop</h2>
<label>Enter number:
<input type="number" id="whileNumber" />
</label>
<label>Enter text:
<input type="text" id="whileText" />
</label>
<div class="btn-group">
<button class="btn-show" onclick="showWhile()">Show</button>
<button class="btn-clear" onclick="clearWhile()">Clear</button>
</div>
<ol id="whileOutput"></ol>
</div>
<!-- DO-WHILE LOOP -->
<div class="box">
<h2>Do-While Loop</h2>
<label>Enter number:
<input type="number" id="doWhileNumber" />
</label>
<label>Enter text:
<input type="text" id="doWhileText" />
</label>
<div class="btn-group">
<button class="btn-show" onclick="showDoWhile()">Show</button>
<button class="btn-clear" onclick="clearDoWhile()">Clear</button>
</div>
<ol id="doWhileOutput"></ol>
</div>

</div>
<script src="script.js"></script>
</body>
</html>
